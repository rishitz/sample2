name: Simlpe workflow

on:
    workflow_dispatch: 

jobs:

    general:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Running
              run: |
                echo "hii from ${{ vars.REGION }}"
    
    
    DEV:
        runs-on: ubuntu-latest
        environment: DEV
        steps:
            - uses: actions/checkout@v3
            - name: Running from dev
              run: |
                echo "hii ${{ secrets.SECRET1 }} from region ${{ vars.REGION }}"

    QA:
        runs-on: ubuntu-latest
        environment: staging
        needs: DEV
        steps:
            - uses: actions/checkout@v3
            - name: Running from QA
              run: |
                echo "hii from staging"
    Prod:
        runs-on: ubuntu-latest
        environment: Prod
        needs: QA
        steps:
            - uses: actions/checkout@v3
            - name: Running from prod
              run: |
                echo "hii from ${{ secrets.AWS_SECRET_KEYS }}"
    



